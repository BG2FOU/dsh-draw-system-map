name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so commitlint can validate the pushed/PR commit range.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx --no-install commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            npx --no-install commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"
          else
            npx --no-install commitlint --last
          fi

      - name: Plugin unit tests
        run: npm test

      - name: Skill unittest suite
        run: npm run test:skill

      - name: Package contents
        run: npm pack --dry-run
